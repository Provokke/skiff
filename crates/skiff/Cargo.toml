[package]
name = "skiff"
description = "UDP endpoint for skiff-quic connections plus skiff-server / skiff-client (stream echo and HTTP/3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
skiff-quic.workspace = true
skiff-h3.workspace = true
skiff-wire.workspace = true
thiserror.workspace = true
rustls.workspace = true
rcgen.workspace = true

[[bin]]
name = "skiff-server"
path = "src/bin/skiff-server.rs"

[[bin]]
name = "skiff-client"
path = "src/bin/skiff-client.rs"
